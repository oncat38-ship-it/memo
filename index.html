<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>モバイル ユーティリティ Web App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PapaParse (CSV Parsing) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- JsBarcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <!-- QR Code Generator -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Hide scrollbars for clean mobile feel */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col justify-between select-none">

    <!-- Top Header -->
    <header class="sticky top-0 z-20 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="p-1.5 bg-indigo-600 text-white rounded-lg shadow-sm">
                <i data-lucide="smartphone" class="w-5 h-5"></i>
            </div>
            <h1 class="font-bold text-base tracking-tight" id="header-title">メモ帳</h1>
        </div>
        <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 active:scale-95 transition">
            <i data-lucide="sun" class="w-4 h-4 dark:hidden"></i>
            <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto pb-24 px-4 pt-4 max-w-md mx-auto w-full">

        <!-- 1. MEMO TAB -->
        <section id="tab-memo" class="tab-content space-y-3">
            <div class="flex justify-between items-center bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <span id="memo-char-count" class="text-xs font-medium text-slate-500 pl-1">0 文字</span>
                <div class="flex items-center space-x-1.5">
                    <select id="memo-export-ext" class="bg-slate-100 dark:bg-slate-800 border-0 rounded-xl text-xs px-2.5 py-1.5 font-medium focus:ring-0">
                        <option value="txt">.txt</option>
                        <option value="md">.md</option>
                        <option value="csv">.csv</option>
                        <option value="json">.json</option>
                        <option value="html">.html</option>
                    </select>
                    <button onclick="downloadMemo()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-1.5 rounded-xl shadow-sm flex items-center space-x-1 active:scale-95 transition">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i>
                        <span>保存</span>
                    </button>
                    <button onclick="clearMemo()" class="p-1.5 text-slate-400 hover:text-red-500 rounded-xl active:scale-95 transition">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 shadow-sm space-y-3">
                <input type="text" id="memo-title" placeholder="タイトルを入力..." class="w-full text-base font-bold bg-transparent border-b border-slate-100 dark:border-slate-800 pb-2 focus:outline-none">
                <textarea id="memo-content" placeholder="メモを入力..." class="w-full h-80 bg-transparent resize-none focus:outline-none text-sm code-font leading-relaxed" oninput="updateMemoStats()"></textarea>
            </div>
        </section>

        <!-- 2. CONVERTER TAB -->
        <section id="tab-converter" class="tab-content hidden space-y-4">
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 shadow-sm space-y-3">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">入力データ</label>
                    <label class="cursor-pointer text-indigo-600 dark:text-indigo-400 text-xs font-semibold flex items-center space-x-1 active:opacity-70">
                        <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                        <span>ファイル選択</span>
                        <input type="file" id="converter-file-input" class="hidden" onchange="handleFileUpload(event)">
                    </label>
                </div>
                <textarea id="converter-input" placeholder="テキストやJSON、CSVなどを入力..." class="w-full h-32 p-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl focus:outline-none code-font text-xs resize-none"></textarea>
            </div>

            <!-- Action Grid -->
            <div class="grid grid-cols-2 gap-2">
                <button onclick="convertData('json-to-csv')" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 rounded-xl text-xs font-semibold text-center shadow-sm active:scale-95 transition">JSON ➔ CSV</button>
                <button onclick="convertData('csv-to-json')" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 rounded-xl text-xs font-semibold text-center shadow-sm active:scale-95 transition">CSV ➔ JSON</button>
                <button onclick="convertData('encode-base64')" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 rounded-xl text-xs font-semibold text-center shadow-sm active:scale-95 transition">Base64 エンコード</button>
                <button onclick="convertData('decode-base64')" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 rounded-xl text-xs font-semibold text-center shadow-sm active:scale-95 transition">Base64 デコード</button>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 shadow-sm space-y-3">
                <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">変換結果</label>
                <textarea id="converter-output" readonly placeholder="変換結果が表示されます..." class="w-full h-32 p-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl focus:outline-none code-font text-xs resize-none"></textarea>
                
                <div class="flex items-center space-x-2 pt-1">
                    <input type="text" id="converter-filename" value="converted" placeholder="ファイル名" class="flex-1 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs p-2.5">
                    <select id="converter-ext" class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs p-2.5">
                        <option value="txt">.txt</option>
                        <option value="csv">.csv</option>
                        <option value="json">.json</option>
                        <option value="md">.md</option>
                    </select>
                    <button onclick="downloadConvertedFile()" class="bg-indigo-600 text-white p-2.5 rounded-xl active:scale-95 transition">
                        <i data-lucide="download" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- 3. VAULT TAB -->
        <section id="tab-vault" class="tab-content hidden space-y-3">
            <button onclick="openVaultModal()" class="w-full bg-indigo-600 text-white py-3 rounded-2xl font-semibold text-xs shadow-md flex items-center justify-center space-x-2 active:scale-95 transition">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>新規キー・短文を登録</span>
            </button>

            <div id="vault-list" class="space-y-3">
                <!-- Dynamic Items -->
            </div>
        </section>

        <!-- 4. IMAGE TAB -->
        <section id="tab-image" class="tab-content hidden space-y-4">
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 shadow-sm space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">画像を選択</label>
                    <input type="file" id="image-input" accept="image/*" onchange="loadImage(event)" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-600 dark:file:bg-slate-800 dark:file:text-slate-300">
                </div>

                <div id="image-preview-container" class="hidden text-center border border-dashed border-slate-200 dark:border-slate-800 p-2 rounded-xl">
                    <img id="image-preview" class="max-h-48 mx-auto rounded-lg object-contain">
                </div>

                <div class="space-y-3 border-t border-slate-100 dark:border-slate-800 pt-3">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <span class="text-[10px] text-slate-400 font-semibold">幅 (px)</span>
                            <input type="number" id="img-width" onchange="handleDimensionChange('w')" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs p-2.5">
                        </div>
                        <div>
                            <span class="text-[10px] text-slate-400 font-semibold">高さ (px)</span>
                            <input type="number" id="img-height" onchange="handleDimensionChange('h')" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs p-2.5">
                        </div>
                    </div>
                    <label class="flex items-center space-x-2 text-xs text-slate-600 dark:text-slate-400">
                        <input type="checkbox" id="img-aspect-ratio" checked class="rounded text-indigo-600">
                        <span>アスペクト比を固定</span>
                    </label>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">フォーマット</label>
                    <select id="img-format" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs p-2.5 font-medium">
                        <option value="image/png">PNG (.png)</option>
                        <option value="image/jpeg">JPEG (.jpg)</option>
                        <option value="image/webp">WebP (.webp)</option>
                    </select>
                </div>

                <button onclick="processAndDownloadImage()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold text-xs shadow-md flex items-center justify-center space-x-2 active:scale-95 transition">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span>変換して保存</span>
                </button>
            </div>
        </section>

        <!-- 5. CODE / QR TAB -->
        <section id="tab-code" class="tab-content hidden space-y-4">
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 shadow-sm space-y-4">
                <div class="grid grid-cols-2 gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                    <button onclick="setCodeType('qr')" id="btn-type-qr" class="code-type-btn text-xs py-2 rounded-lg font-semibold transition">QRコード</button>
                    <button onclick="setCodeType('barcode')" id="btn-type-barcode" class="code-type-btn text-xs py-2 rounded-lg font-semibold transition">バーコード</button>
                </div>

                <textarea id="code-text" placeholder="URLやテキストを入力..." class="w-full h-20 p-3 bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl focus:outline-none text-xs resize-none" oninput="generateCode()"></textarea>

                <!-- QR Controls -->
                <div id="qr-style-options" class="space-y-3 border-t border-slate-100 dark:border-slate-800 pt-3">
                    <div>
                        <span class="text-[10px] text-slate-400 font-semibold block mb-1">ドット（点）デザイン</span>
                        <select id="qr-dot-style" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs p-2.5 font-medium" onchange="generateCode()">
                            <option value="square">四角 (Standard)</option>
                            <option value="dots">丸 (Dots)</option>
                            <option value="rounded">角丸 (Rounded)</option>
                            <option value="star">星型 (Star)</option>
                            <option value="diamond">ひし形 (Diamond)</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <span class="text-[10px] text-slate-400 font-semibold block mb-1">前景色</span>
                            <input type="color" id="qr-fg-color" value="#000000" class="w-full h-9 rounded-xl border border-slate-200 dark:border-slate-800 cursor-pointer p-0.5 bg-transparent" onchange="generateCode()">
                        </div>
                        <div>
                            <span class="text-[10px] text-slate-400 font-semibold block mb-1">背景色</span>
                            <input type="color" id="qr-bg-color" value="#ffffff" class="w-full h-9 rounded-xl border border-slate-200 dark:border-slate-800 cursor-pointer p-0.5 bg-transparent" onchange="generateCode()">
                        </div>
                    </div>
                </div>

                <!-- Barcode Options -->
                <div id="barcode-style-options" class="space-y-2 border-t border-slate-100 dark:border-slate-800 pt-3 hidden">
                    <span class="text-[10px] text-slate-400 font-semibold block">バーコード規格</span>
                    <select id="barcode-format" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs p-2.5 font-medium" onchange="generateCode()">
                        <option value="CODE128">CODE128 (汎用)</option>
                        <option value="EAN13">EAN-13 (JAN)</option>
                        <option value="UPC">UPC</option>
                    </select>
                </div>

                <!-- Preview Display -->
                <div class="bg-slate-50 dark:bg-slate-950 p-4 rounded-xl border border-slate-200 dark:border-slate-800 flex justify-center items-center min-h-[180px]">
                    <canvas id="code-canvas" class="max-w-full"></canvas>
                    <svg id="barcode-svg" class="hidden"></svg>
                </div>

                <button onclick="downloadCodeImage()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold text-xs shadow-md flex items-center justify-center space-x-2 active:scale-95 transition">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span>画像として保存</span>
                </button>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar (Mobile Native Style) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-2 py-2 z-30">
        <div class="max-w-md mx-auto grid grid-cols-5 gap-1">
            <button onclick="switchTab('memo')" id="nav-memo" class="nav-btn flex flex-col items-center justify-center py-1 rounded-xl text-indigo-600 dark:text-indigo-400">
                <i data-lucide="file-text" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">メモ</span>
            </button>
            <button onclick="switchTab('converter')" id="nav-converter" class="nav-btn flex flex-col items-center justify-center py-1 rounded-xl text-slate-400">
                <i data-lucide="file-code" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">変換</span>
            </button>
            <button onclick="switchTab('vault')" id="nav-vault" class="nav-btn flex flex-col items-center justify-center py-1 rounded-xl text-slate-400">
                <i data-lucide="key-round" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">保管庫</span>
            </button>
            <button onclick="switchTab('image')" id="nav-image" class="nav-btn flex flex-col items-center justify-center py-1 rounded-xl text-slate-400">
                <i data-lucide="image" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">画像</span>
            </button>
            <button onclick="switchTab('code')" id="nav-code" class="nav-btn flex flex-col items-center justify-center py-1 rounded-xl text-slate-400">
                <i data-lucide="qr-code" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">コード</span>
            </button>
        </div>
    </nav>

    <!-- Vault Modal (Bottom Sheet Style) -->
    <div id="vault-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center">
        <div class="bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-2xl border border-slate-200 dark:border-slate-800 p-5 w-full max-w-md shadow-2xl space-y-4 animate-in slide-in-from-bottom duration-200">
            <div class="w-12 h-1 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto sm:hidden"></div>
            <h3 class="text-base font-bold">新規保管アイテム</h3>
            
            <div class="space-y-3">
                <input type="text" id="vault-input-title" placeholder="タイトル (例: GitHub Pass)" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs p-3 focus:outline-none">
                <textarea id="vault-input-value" placeholder="保管する内容..." class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl text-xs p-3 h-24 resize-none code-font focus:outline-none"></textarea>
                <label class="flex items-center space-x-2 text-xs text-slate-600 dark:text-slate-400">
                    <input type="checkbox" id="vault-input-mask" checked class="rounded text-indigo-600">
                    <span>伏字（マスク）で表示する</span>
                </label>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="closeVaultModal()" class="py-2.5 text-xs font-semibold text-slate-500 bg-slate-100 dark:bg-slate-800 rounded-xl">キャンセル</button>
                <button onclick="saveVaultItem()" class="py-2.5 text-xs font-semibold bg-indigo-600 text-white rounded-xl shadow-md">保存</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const titles = { memo: '純粋メモ帳', converter: 'ファイル変換', vault: 'キー保管庫', image: '画像加工', code: 'コード生成' };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('text-indigo-600', 'dark:text-indigo-400');
                el.classList.add('text-slate-400');
            });

            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            const activeNav = document.getElementById(`nav-${tabId}`);
            activeNav.classList.remove('text-slate-400');
            activeNav.classList.add('text-indigo-600', 'dark:text-indigo-400');

            document.getElementById('header-title').innerText = titles[tabId];
            if (tabId === 'code') generateCode();
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        // --- 1. MEMO LOGIC ---
        const memoTitle = document.getElementById('memo-title');
        const memoContent = document.getElementById('memo-content');

        memoTitle.value = localStorage.getItem('app_memo_title') || '';
        memoContent.value = localStorage.getItem('app_memo_content') || '';
        updateMemoStats();

        memoTitle.addEventListener('input', () => localStorage.setItem('app_memo_title', memoTitle.value));
        memoContent.addEventListener('input', () => {
            localStorage.setItem('app_memo_content', memoContent.value);
            updateMemoStats();
        });

        function updateMemoStats() {
            document.getElementById('memo-char-count').innerText = `${memoContent.value.length} 文字`;
        }

        function clearMemo() {
            if (confirm('メモを消去しますか？')) {
                memoTitle.value = '';
                memoContent.value = '';
                localStorage.removeItem('app_memo_title');
                localStorage.removeItem('app_memo_content');
                updateMemoStats();
            }
        }

        function downloadMemo() {
            const title = memoTitle.value.trim() || 'memo';
            const ext = document.getElementById('memo-export-ext').value;
            let content = memoContent.value;

            if (ext === 'json') content = JSON.stringify({ title, content }, null, 2);
            else if (ext === 'html') content = `<!DOCTYPE html><html><body><h1>${title}</h1><pre>${content}</pre></body></html>`;

            downloadBlob(content, `${title}.${ext}`, 'text/plain;charset=utf-8');
        }

        // --- 2. CONVERTER LOGIC ---
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => { document.getElementById('converter-input').value = evt.target.result; };
            reader.readAsText(file);
        }

        function convertData(type) {
            const input = document.getElementById('converter-input').value;
            const outputEl = document.getElementById('converter-output');

            try {
                if (type === 'json-to-csv') outputEl.value = Papa.unparse(JSON.parse(input));
                else if (type === 'csv-to-json') outputEl.value = JSON.stringify(Papa.parse(input, { header: true }).data, null, 2);
                else if (type === 'encode-base64') outputEl.value = btoa(unescape(encodeURIComponent(input)));
                else if (type === 'decode-base64') outputEl.value = decodeURIComponent(escape(atob(input)));
            } catch (err) { alert('エラー: ' + err.message); }
        }

        function downloadConvertedFile() {
            const text = document.getElementById('converter-output').value;
            const name = document.getElementById('converter-filename').value || 'file';
            const ext = document.getElementById('converter-ext').value;

            if (!text) return alert('出力データがありません');
            downloadBlob(text, `${name}.${ext}`, 'text/plain;charset=utf-8');
        }

        // --- 3. VAULT LOGIC ---
        let vaultItems = JSON.parse(localStorage.getItem('app_vault_items') || '[]');

        function renderVault() {
            const container = document.getElementById('vault-list');
            container.innerHTML = '';

            if (vaultItems.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs">データがありません</div>`;
                return;
            }

            vaultItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-3.5 shadow-sm space-y-2";
                const displayVal = item.masked ? '•'.repeat(Math.min(item.value.length, 16)) : item.value;

                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-xs truncate">${escapeHtml(item.title)}</span>
                        <button onclick="deleteVaultItem(${index})" class="text-slate-400 p-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                    </div>
                    <div class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-2.5 text-xs code-font break-all">${escapeHtml(displayVal)}</div>
                    <div class="flex space-x-2 pt-1">
                        <button onclick="toggleVaultMask(${index})" class="flex-1 py-1.5 bg-slate-100 dark:bg-slate-800 rounded-xl text-[11px] font-semibold text-slate-600 dark:text-slate-300">${item.masked ? '表示' : '隠す'}</button>
                        <button onclick="copyToClipboard('${escapeJs(item.value)}')" class="flex-1 py-1.5 bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 rounded-xl text-[11px] font-semibold">コピー</button>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function openVaultModal() { document.getElementById('vault-modal').classList.remove('hidden'); }
        function closeVaultModal() { document.getElementById('vault-modal').classList.add('hidden'); }

        function saveVaultItem() {
            const title = document.getElementById('vault-input-title').value.trim();
            const value = document.getElementById('vault-input-value').value;
            const masked = document.getElementById('vault-input-mask').checked;

            if (!title || !value) return alert('入力してください');

            vaultItems.push({ title, value, masked });
            localStorage.setItem('app_vault_items', JSON.stringify(vaultItems));

            document.getElementById('vault-input-title').value = '';
            document.getElementById('vault-input-value').value = '';
            closeVaultModal();
            renderVault();
        }

        function toggleVaultMask(index) { vaultItems[index].masked = !vaultItems[index].masked; renderVault(); }
        function deleteVaultItem(index) { if (confirm('削除しますか？')) { vaultItems.splice(index, 1); localStorage.setItem('app_vault_items', JSON.stringify(vaultItems)); renderVault(); } }

        // --- 4. IMAGE LOGIC ---
        let currentLoadedImage = null;

        function loadImage(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => {
                    currentLoadedImage = img;
                    document.getElementById('img-width').value = img.width;
                    document.getElementById('img-height').value = img.height;
                    document.getElementById('image-preview').src = evt.target.result;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleDimensionChange(type) {
            if (!currentLoadedImage || !document.getElementById('img-aspect-ratio').checked) return;
            const ratio = currentLoadedImage.width / currentLoadedImage.height;
            if (type === 'w') document.getElementById('img-height').value = Math.round(document.getElementById('img-width').value / ratio);
            else document.getElementById('img-width').value = Math.round(document.getElementById('img-height').value * ratio);
        }

        function processAndDownloadImage() {
            if (!currentLoadedImage) return alert('画像を選択してください');

            const canvas = document.createElement('canvas');
            const w = parseInt(document.getElementById('img-width').value);
            const h = parseInt(document.getElementById('img-height').value);
            const format = document.getElementById('img-format').value;

            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(currentLoadedImage, 0, 0, w, h);

            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `image.${format.split('/')[1]}`;
                a.click();
                URL.revokeObjectURL(url);
            }, format);
        }

        // --- 5. CODE / QR LOGIC ---
        let currentCodeType = 'qr';

        function setCodeType(type) {
            currentCodeType = type;
            document.querySelectorAll('.code-type-btn').forEach(b => b.classList.remove('bg-white', 'dark:bg-slate-900', 'shadow-sm', 'text-indigo-600'));
            
            if (type === 'qr') {
                document.getElementById('btn-type-qr').classList.add('bg-white', 'dark:bg-slate-900', 'shadow-sm', 'text-indigo-600');
                document.getElementById('qr-style-options').classList.remove('hidden');
                document.getElementById('barcode-style-options').classList.add('hidden');
            } else {
                document.getElementById('btn-type-barcode').classList.add('bg-white', 'dark:bg-slate-900', 'shadow-sm', 'text-indigo-600');
                document.getElementById('qr-style-options').classList.add('hidden');
                document.getElementById('barcode-style-options').classList.remove('hidden');
            }
            generateCode();
        }

        function generateCode() {
            const text = document.getElementById('code-text').value.trim() || 'https://example.com';
            const canvas = document.getElementById('code-canvas');
            const svg = document.getElementById('barcode-svg');

            if (currentCodeType === 'qr') {
                canvas.classList.remove('hidden');
                svg.classList.add('hidden');

                const dotStyle = document.getElementById('qr-dot-style').value;
                const fgColor = document.getElementById('qr-fg-color').value;
                const bgColor = document.getElementById('qr-bg-color').value;

                try {
                    const qr = qrcode(0, 'H');
                    qr.addData(text);
                    qr.make();

                    const count = qr.getModuleCount();
                    const cellSize = 8;
                    const margin = 16;
                    const size = count * cellSize + margin * 2;

                    canvas.width = size;
                    canvas.height = size;

                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = bgColor;
                    ctx.fillRect(0, 0, size, size);
                    ctx.fillStyle = fgColor;

                    for (let r = 0; r < count; r++) {
                        for (let c = 0; c < count; c++) {
                            if (qr.isDark(r, c)) {
                                const x = c * cellSize + margin;
                                const y = r * cellSize + margin;

                                if (dotStyle === 'dots') {
                                    ctx.beginPath();
                                    ctx.arc(x + cellSize / 2, y + cellSize / 2, cellSize / 2.2, 0, Math.PI * 2);
                                    ctx.fill();
                                } else if (dotStyle === 'rounded') {
                                    ctx.beginPath();
                                    ctx.roundRect(x, y, cellSize, cellSize, 2);
                                    ctx.fill();
                                } else if (dotStyle === 'star') {
                                    drawStar(ctx, x + cellSize/2, y + cellSize/2, 5, cellSize/2, cellSize/4);
                                } else if (dotStyle === 'diamond') {
                                    ctx.beginPath();
                                    ctx.moveTo(x + cellSize / 2, y);
                                    ctx.lineTo(x + cellSize, y + cellSize / 2);
                                    ctx.lineTo(x + cellSize / 2, y + cellSize);
                                    ctx.lineTo(x, y + cellSize / 2);
                                    ctx.closePath();
                                    ctx.fill();
                                } else {
                                    ctx.fillRect(x, y, cellSize, cellSize);
                                }
                            }
                        }
                    }
                } catch (e) {}
            } else {
                canvas.classList.add('hidden');
                svg.classList.remove('hidden');
                try {
                    JsBarcode("#barcode-svg", text, {
                        format: document.getElementById('barcode-format').value,
                        lineColor: "#000",
                        width: 2,
                        height: 60,
                        displayValue: true
                    });
                } catch (e) {}
            }
        }

        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx, y = cy, step = Math.PI / spikes;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;
                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fill();
        }

        function downloadCodeImage() {
            if (currentCodeType === 'qr') {
                const canvas = document.getElementById('code-canvas');
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = 'qrcode.png';
                a.click();
            } else {
                const svg = document.getElementById('barcode-svg');
                const xml = new XMLSerializer().serializeToString(svg);
                const svgBlob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(svgBlob);
                
                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);

                    const a = document.createElement('a');
                    a.href = canvas.toDataURL('image/png');
                    a.download = 'barcode.png';
                    a.click();
                };
                img.src = url;
            }
        }

        // --- Helpers ---
        function downloadBlob(content, filename, contentType) {
            const blob = new Blob([content], { type: contentType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => alert('コピーしました'));
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }

        function escapeJs(str) {
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        window.onload = () => {
            lucide.createIcons();
            switchTab('memo');
            renderVault();
            setCodeType('qr');
        };
    </script>
</body>
</html>
